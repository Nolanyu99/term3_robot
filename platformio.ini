; PlatformIO Project Configuration File

[env:giga_r1_m7]
platform = ststm32
board = giga_r1_m7
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/disable_serial_upload_touch.py
build_unflags =
    -std=c++11
    -std=gnu++11
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -D LOG_LEVEL=LOG_LEVEL_DEBUG
    -D LOG_BAUDRATE=115200
